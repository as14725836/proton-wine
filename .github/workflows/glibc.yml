name: Proton 11.0-1 ARM64EC — Termux glibc + termux-x11

run-name: "Proton 11.0-1 ARM64EC / Termux glibc / X11 — ${{ github.ref_name }}"

on:
  push:
    branches:
      - main
      - master
      - proton_11.0
      - 'staging/proton_11.0/**'

  pull_request:
    branches:
      - main
      - master
      - proton_11.0

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # ------------------------------------------------------------
    # IMPORTANT
    #
    # Native Wine/Unix side is glibc AArch64.
    # Therefore use an ARM64 Ubuntu runner.
    # ------------------------------------------------------------
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64

    env:
      # ----------------------------------------------------------
      # Architecture
      # ----------------------------------------------------------
      ARCH: aarch64
      TARGET: aarch64-linux-gnu
      WIN_ARCH: arm64ec,aarch64,i386

      # ----------------------------------------------------------
      # Real Termux glibc layout
      #
      # Runtime:
      #
      # /data/data/com.termux/files/usr/glibc
      #
      # This is the official Termux glibc prefix layout.
      # ----------------------------------------------------------
      TERMUX_PREFIX: /data/data/com.termux/files/usr
      GLIBC_PREFIX: /data/data/com.termux/files/usr/glibc

      # CI-side staging root.
      #
      # Expected:
      #
      # termuxfs/
      # └── aarch64-glibc/
      #     └── data/
      #         └── data/
      #             └── com.termux/
      #                 └── files/
      #                     └── usr/
      #                         └── glibc/
      #
      GLIBC_ROOTFS: ${{ github.workspace }}/termuxfs/aarch64-glibc

      # Termux writable tmp.
      TERMUX_TMPDIR: /data/data/com.termux/files/usr/tmp

      # ----------------------------------------------------------
      # LLVM-MinGW
      # ----------------------------------------------------------
      LLVM_MINGW_VERSION: 20250920

      # ----------------------------------------------------------
      # Runtime display
      #
      # Termux-X11 is primary.
      # ----------------------------------------------------------
      DISPLAY: :0
      GDK_BACKEND: x11
      XDG_SESSION_TYPE: x11

      # ----------------------------------------------------------
      # Wine build options
      # ----------------------------------------------------------
      ENABLE_WAYLAND: auto

      # Do not build Android-specific helper libraries.
      BUILD_ANDROID_SYSVSHM: "0"
      BUILD_NTSYNC_ANDROID: "0"

      # ----------------------------------------------------------
      # ccache
      # ----------------------------------------------------------
      CCACHE_MAXSIZE: 5G

    steps:

      # ============================================================
      # Host
      # ============================================================

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # Native ARM64 glibc build dependencies
      # ============================================================

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev \
            libc6-dev-i386 \
            git \
            wget \
            curl \
            unzip \
            xz-utils \
            zstd \
            flex \
            bison \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            ccache \
            llvm \
            clang \
            libwayland-bin \
            libfreetype6-dev \
            libpng-dev \
            zlib1g-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxfixes-dev

      # ============================================================
      # Verify host
      # ============================================================

      - name: Verify ARM64 glibc host
        run: |
          echo "== uname =="
          uname -a

          echo
          echo "== architecture =="
          uname -m

          echo
          echo "== native compiler =="
          cc --version | head -n 2

          echo
          echo "== cross compiler =="
          aarch64-linux-gnu-gcc --version | head -n 2

          test "$(uname -m)" = "aarch64" || {
            echo "FATAL: runner is not AArch64"
            exit 1
          }

      # ============================================================
      # Termux glibc rootfs
      #
      # IMPORTANT:
      # This is NOT the old GameNative bionic termuxfs.
      #
      # The glibc-build-step-arm64ec.sh expects:
      #
      #   $GLIBC_ROOTFS/data/data/com.termux/files/usr/glibc
      #
      # ============================================================

      - name: Verify Termux glibc rootfs
        run: |
          DEPS="$GLIBC_ROOTFS/data/data/com.termux/files/usr/glibc"

          echo "GLIBC_ROOTFS:"
          echo "$GLIBC_ROOTFS"

          echo
          echo "GLIBC prefix:"
          echo "$DEPS"

          test -d "$DEPS" || {
            echo
            echo "FATAL: Termux glibc prefix does not exist:"
            echo "$DEPS"
            echo
            echo "The workflow must provide a real Termux glibc rootfs."
            exit 1
          }

          test -d "$DEPS/lib" || {
            echo "FATAL: missing glibc lib directory"
            exit 1
          }

          test -d "$DEPS/include" || {
            echo "FATAL: missing glibc include directory"
            exit 1
          }

          test -d "$DEPS/share" || {
            echo "FATAL: missing glibc share directory"
            exit 1
          }

          echo "DEPS=$DEPS" >> "$GITHUB_ENV"

          echo
          echo "== glibc prefix =="
          ls -ld "$DEPS"
          ls -ld "$DEPS/lib"
          ls -ld "$DEPS/include"

      # ============================================================
      # LLVM-MinGW
      # ============================================================

      - name: Cache LLVM MinGW
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}

      - name: Install LLVM MinGW
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"

          ARCHIVE="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"

          wget \
            --tries=5 \
            --retry-connrefused \
            --waitretry=10 \
            "https://github.com/bylaws/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${ARCHIVE}"

          tar -xf "$ARCHIVE"

      - name: Export LLVM MinGW
        run: |
          LLVM_MINGW_PATH="$HOME/toolchains/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"

          test -d "$LLVM_MINGW_PATH" || {
            echo "FATAL: LLVM-MinGW not found"
            exit 1
          }

          echo "LLVM_MINGW=$LLVM_MINGW_PATH" >> "$GITHUB_ENV"

          echo "LLVM MinGW:"
          echo "$LLVM_MINGW_PATH"

      # ============================================================
      # Verify LLVM-MinGW
      # ============================================================

      - name: Verify LLVM MinGW
        run: |
          test -x "$LLVM_MINGW/bin/clang" || {
            echo "FATAL: LLVM-MinGW clang missing"
            exit 1
          }

          test -x "$LLVM_MINGW/bin/llvm-dlltool" || {
            echo "FATAL: LLVM-MinGW llvm-dlltool missing"
            exit 1
          }

          "$LLVM_MINGW/bin/clang" --version | head -n 3

      # ============================================================
      # Autoconf / Wine tools
      # ============================================================

      - name: Autogen
        run: |
          bash build-scripts/build-step0-autogen.sh

      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine-tools
          key: wine-tools-arm64-glibc-${{ hashFiles('configure.ac', 'configure') }}

      - name: Build wine-tools
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        run: |
          bash build-scripts/build-step0.sh

      # ============================================================
      # ccache
      # ============================================================

      - name: Configure ccache
        run: |
          mkdir -p "$HOME/.ccache"

          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6

          ccache --zero-stats || true

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-p11-arm64ec-glibc-${{ github.sha }}
          restore-keys: |
            ccache-p11-arm64ec-glibc-

      # ============================================================
      # IMPORTANT:
      #
      # No Android NDK.
      # No android_sysvshm.
      # No ntsync-android.
      #
      # Native side is:
      #
      #   aarch64-linux-gnu
      #       +
      #   Termux glibc
      #
      # Windows side remains:
      #
      #   arm64ec + aarch64 + i386
      #
      # ============================================================

      - name: Configure ARM64EC Proton
        env:
          DEPS: ${{ env.DEPS }}
          GLIBC_PREFIX: ${{ env.GLIBC_PREFIX }}
          LLVM_MINGW: ${{ env.LLVM_MINGW }}
          TARGET: ${{ env.TARGET }}
          WIN_ARCH: ${{ env.WIN_ARCH }}
          TERMUX_TMPDIR: ${{ env.TERMUX_TMPDIR }}
          ENABLE_WAYLAND: ${{ env.ENABLE_WAYLAND }}
        run: |
          bash build-scripts/glibc-build-step-arm64ec.sh \
            --configure

      # ============================================================
      # Build
      # ============================================================

      - name: Build ARM64EC Proton
        env:
          DEPS: ${{ env.DEPS }}
          GLIBC_PREFIX: ${{ env.GLIBC_PREFIX }}
          LLVM_MINGW: ${{ env.LLVM_MINGW }}
          TARGET: ${{ env.TARGET }}
          WIN_ARCH: ${{ env.WIN_ARCH }}
          TERMUX_TMPDIR: ${{ env.TERMUX_TMPDIR }}
          ENABLE_WAYLAND: ${{ env.ENABLE_WAYLAND }}
        run: |
          bash build-scripts/glibc-build-step-arm64ec.sh \
            --build

      - name: ccache statistics
        if: always()
        run: |
          ccache -s || true

      # ============================================================
      # Install
      # ============================================================

      - name: Install ARM64EC Proton
        env:
          DEPS: ${{ env.DEPS }}
          GLIBC_PREFIX: ${{ env.GLIBC_PREFIX }}
          LLVM_MINGW: ${{ env.LLVM_MINGW }}
          TARGET: ${{ env.TARGET }}
          WIN_ARCH: ${{ env.WIN_ARCH }}
          TERMUX_TMPDIR: ${{ env.TERMUX_TMPDIR }}
          ENABLE_WAYLAND: ${{ env.ENABLE_WAYLAND }}
        run: |
          bash build-scripts/glibc-build-step-arm64ec.sh \
            --install

      # ============================================================
      # Verify output
      # ============================================================

      - name: Verify output tree
        run: |
          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          test -d "$OUTPUT_DIR" || {
            echo "FATAL: missing output directory"
            exit 1
          }

          echo "== Output =="
          du -sh "$OUTPUT_DIR"

          echo
          echo "== Tree =="
          find "$OUTPUT_DIR/lib/wine" \
            -maxdepth 2 \
            -type f \
            \( \
              -name 'ntdll.so' \
              -o -name 'win32u.so' \
              -o -name 'wineX11.drv' \
              -o -name 'winewayland.so' \
            \) \
            -print

      # ============================================================
      # Verify native Wine ELF
      # ============================================================

      - name: Verify native glibc Wine
        run: |
          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          WINE_ELF="$OUTPUT_DIR/lib/wine/aarch64-unix/wine"

          test -f "$WINE_ELF" || {
            echo "FATAL: Wine native ELF missing:"
            echo "$WINE_ELF"
            exit 1
          }

          echo "== file =="
          file "$WINE_ELF"

          echo
          echo "== interpreter =="
          llvm-readelf -l "$WINE_ELF" |
            grep 'Requesting program interpreter' || true

          echo
          echo "== NEEDED =="
          llvm-readelf -d "$WINE_ELF" |
            grep NEEDED || true

          echo
          echo "== Check Android loader =="
          if llvm-readelf -l "$WINE_ELF" |
              grep -q 'ld-android'; then
            echo "FATAL: Android loader detected"
            exit 1
          fi

          echo
          echo "== Check Android native libraries =="
          if llvm-readelf -d "$WINE_ELF" |
              grep -Eq 'libandroid|liblog|libnativewindow'; then
            echo "FATAL: Android-specific native dependency detected"
            exit 1
          fi

      # ============================================================
      # Verify X11
      # ============================================================

      - name: Verify X11 driver
        run: |
          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          FOUND=0

          for f in \
            "$OUTPUT_DIR/lib/wine/aarch64-unix/wineX11.drv" \
            "$OUTPUT_DIR/lib/wine/aarch64-windows/wineX11.drv" \
            "$OUTPUT_DIR/lib/wine/i386-windows/wineX11.drv"
          do
            if [ -f "$f" ]; then
              echo "OK: $f"
              file "$f"
              FOUND=1
            fi
          done

          if [ "$FOUND" != "1" ]; then
            echo "FATAL: Wine X11 driver was not built"
            exit 1
          fi

      # ============================================================
      # Verify Wayland
      #
      # Wayland is optional.
      # Termux-X11 remains the primary backend.
      # ============================================================

      - name: Check optional Wayland
        run: |
          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          FOUND=0

          for f in \
            "$OUTPUT_DIR/lib/wine/aarch64-unix/winewayland.so" \
            "$OUTPUT_DIR/lib/wine/aarch64-windows/winewayland.drv" \
            "$OUTPUT_DIR/lib/wine/i386-windows/winewayland.drv"
          do
            if [ -f "$f" ]; then
              echo "Wayland available: $f"
              FOUND=1
            fi
          done

          if [ "$FOUND" = "0" ]; then
            echo "Wayland driver not present."
            echo "This is allowed."
            echo "X11 is the primary runtime backend."
          fi

      # ============================================================
      # Verify native ELF dependencies
      # ============================================================

      - name: Verify native ELF dependencies
        run: |
          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          echo "== Native ELF files =="

          find "$OUTPUT_DIR/lib/wine/aarch64-unix" \
            -type f \
            -print0 |
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'ELF'; then

              echo
              echo "---- $f ----"

              llvm-readelf -d "$f" 2>/dev/null |
                grep NEEDED || true

              if llvm-readelf -d "$f" 2>/dev/null |
                  grep -Eq 'libandroid|ld-android'; then
                echo "FATAL: Android dependency found:"
                echo "$f"
                exit 1
              fi
            fi
          done

      # ============================================================
      # Generate glibc runtime information
      # ============================================================

      - name: Generate runtime metadata
        run: |
          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          cat > "$OUTPUT_DIR/termux-glibc-runtime.txt" <<'EOF'
          Proton 11.0-1 ARM64EC
          Target: Termux glibc
          Architecture: aarch64
          Native target: aarch64-linux-gnu

          Runtime prefix:
          /data/data/com.termux/files/usr/glibc

          Display:
          termux-x11
          DISPLAY=:0
          GDK_BACKEND=x11
          XDG_SESSION_TYPE=x11

          Windows targets:
          arm64ec
          aarch64
          i386

          Android NDK:
          NOT USED

          android_sysvshm:
          NOT USED

          ntsync-android:
          NOT USED

          Wayland:
          OPTIONAL
          EOF

          cat "$OUTPUT_DIR/termux-glibc-runtime.txt"

      # ============================================================
      # PrefixPack
      #
      # DO NOT download:
      #
      # GameNative/bionic-prefix-files
      #
      # That package is bionic-oriented.
      #
      # A glibc-compatible prefixPack must be supplied separately.
      # ============================================================

      - name: Verify glibc prefixPack
        run: |
          PREFIX_PACK="$GITHUB_WORKSPACE/prefixPack.txz"

          test -f "$PREFIX_PACK" || {
            echo
            echo "FATAL: glibc prefixPack.txz is missing."
            echo
            echo "Do NOT use:"
            echo "GameNative/bionic-prefix-files"
            echo
            echo "This workflow requires a glibc-compatible prefixPack."
            exit 1
          }

          echo "prefixPack:"
          ls -lh "$PREFIX_PACK"

          file "$PREFIX_PACK"

      # ============================================================
      # Profile
      # ============================================================

      - name: Generate profile.json
        run: |
          cat > "$GITHUB_WORKSPACE/profile.json" <<'EOF'
          {
            "type": "Proton",
            "versionName": "11.0-1-arm64ec-termux-glibc-x11",
            "versionCode": 10,
            "description": "Proton 11.0-1 ARM64EC built for real Termux glibc. Native Unix side targets aarch64-linux-gnu. Termux-X11 is the primary display backend. Wayland is optional. Android NDK, android_sysvshm and ntsync-android are not used.",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

          python3 -m json.tool \
            "$GITHUB_WORKSPACE/profile.json"

      # ============================================================
      # Package
      # ============================================================

      - name: Package Proton WCP
        run: |
          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          test -f "$GITHUB_WORKSPACE/prefixPack.txz" || {
            echo "FATAL: prefixPack.txz missing"
            exit 1
          }

          cd "$OUTPUT_DIR"

          cp "$GITHUB_WORKSPACE/prefixPack.txz" .
          cp "$GITHUB_WORKSPACE/profile.json" .

          tar \
            -I 'zstd -T0 -19' \
            -cf "$GITHUB_WORKSPACE/proton-11.0-1-arm64ec-termux-glibc-x11.wcp" \
            bin \
            lib \
            share \
            prefixPack.txz \
            profile.json \
            termux-glibc-runtime.txt

      # ============================================================
      # Verify WCP
      # ============================================================

      - name: Verify WCP
        run: |
          cd "$GITHUB_WORKSPACE"

          WCP="proton-11.0-1-arm64ec-termux-glibc-x11.wcp"

          test -f "$WCP" || {
            echo "FATAL: WCP missing"
            exit 1
          }

          tar -I zstd -tf "$WCP" > wcp.lst

          for e in \
            profile.json \
            prefixPack.txz \
            bin/wine \
            share/wine/wine.inf \
            termux-glibc-runtime.txt
          do
            grep -qx -- "$e" wcp.lst || {
              echo "FATAL: $e missing from WCP"
              exit 1
            }
          done

          tar \
            -I zstd \
            -xf "$WCP" \
            -O profile.json \
            > wcp-profile.json

          cmp \
            wcp-profile.json \
            profile.json

          python3 -c '
          import json

          with open("wcp-profile.json") as f:
              p = json.load(f)

          print("type:", p["type"])
          print("versionName:", p["versionName"])
          print("versionCode:", p["versionCode"])
          '

          echo
          echo "WCP size:"
          stat -c '%s bytes' "$WCP"

      # ============================================================
      # lsteamclient
      # ============================================================

      - name: Verify lsteamclient
        run: |
          cd "$GITHUB_WORKSPACE"

          tar \
            -I zstd \
            -tf proton-11.0-1-arm64ec-termux-glibc-x11.wcp \
            > wcp.lst

          for e in \
            lib/wine/aarch64-windows/lsteamclient.dll \
            lib/wine/i386-windows/lsteamclient.dll \
            lib/wine/aarch64-unix/lsteamclient.so
          do
            grep -qx -- "$e" wcp.lst || {
              echo "FATAL: missing $e"
              exit 1
            }

            echo "OK: $e"
          done

      # ============================================================
      # Upload WCP
      # ============================================================

      - name: Upload Proton ARM64EC WCP
        uses: actions/upload-artifact@v4
        with:
          name: proton-11.0-1-arm64ec-termux-glibc-x11
          path: proton-11.0-1-arm64ec-termux-glibc-x11.wcp
          retention-days: 30

      # ============================================================
      # Upload installed tree
      # ============================================================

      - name: Upload installed Proton tree
        uses: actions/upload-artifact@v4
        with:
          name: proton-11.0-1-arm64ec-termux-glibc-x11-tree
          path: ${{ env.HOME }}/compiled-files-aarch64
          retention-days: 7
