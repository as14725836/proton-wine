name: Proton 11.0-1 ARM64EC — Termux glibc + termux-x11

run-name: "Proton 11.0-1 ARM64EC / Termux glibc / X11 — ${{ github.ref_name }}"

on:
  push:
    branches:
      - main
      - master
      - proton_11.0
      - 'staging/proton_11.0/**'

  pull_request:
    branches:
      - main
      - master
      - proton_11.0

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64

    env:
      # ==========================================================
      # Architecture
      # ==========================================================

      ARCH: aarch64
      TARGET: aarch64-linux-gnu

      # Windows PE targets.
      #
      # i386 = Windows PE32.
      # It does NOT require Ubuntu i386 packages.
      #
      WIN_ARCH: arm64ec,aarch64,i386

      # ==========================================================
      # Real Termux glibc
      # ==========================================================

      TERMUX_PREFIX: /data/data/com.termux/files/usr

      # Runtime location on Android.
      #
      # This path is NOT used as the CI build directory.
      #
      RUNTIME_PATH: /data/data/com.termux/files/usr/glibc

      # CI staging root.
      GLIBC_ROOTFS: ${{ github.workspace }}/termuxfs/aarch64-glibc

      # Actual glibc prefix inside CI staging root.
      #
      # Result:
      #
      # termuxfs/
      #   aarch64-glibc/
      #     data/data/com.termux/files/usr/glibc/
      #
      GLIBC_PREFIX: ${{ github.workspace }}/termuxfs/aarch64-glibc/data/data/com.termux/files/usr/glibc

      TERMUX_TMPDIR: /data/data/com.termux/files/usr/tmp/runtime

      # ==========================================================
      # LLVM-MinGW
      # ==========================================================

      LLVM_MINGW_VERSION: 20250920

      # ==========================================================
      # Display
      # ==========================================================

      DISPLAY: :0
      GDK_BACKEND: x11
      XDG_SESSION_TYPE: x11
      TERMUX_X11_FORCE_FLIP: "1"

      # ==========================================================
      # Wine
      # ==========================================================

      ENABLE_WAYLAND: auto

      BUILD_ANDROID_SYSVSHM: "0"
      BUILD_NTSYNC_ANDROID: "0"

      # ==========================================================
      # ccache
      # ==========================================================

      CCACHE_MAXSIZE: 5G

    steps:

      # ==========================================================
      # Free disk space
      # ==========================================================

      - name: Free up disk space
        shell: bash
        run: |
          set -eux

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true

          df -h

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ==========================================================
      # Host dependencies
      # ==========================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            xz-utils \
            zstd \
            flex \
            bison \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            ccache \
            llvm \
            clang \
            lld \
            file \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            libwayland-bin \
            libfreetype6-dev \
            libpng-dev \
            zlib1g-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxfixes-dev

      # ==========================================================
      # Verify ARM64 host
      # ==========================================================

      - name: Verify ARM64 glibc host
        shell: bash
        run: |
          set -eux

          echo "== uname =="
          uname -a

          echo
          echo "== machine =="

          uname -m

          test "$(uname -m)" = "aarch64"

          echo
          echo "== compiler =="

          cc --version | head -n 2
          c++ --version | head -n 2

          echo
          echo "== libc =="

          ldd --version | head -n 2

          echo
          echo "== clang =="

          clang --version | head -n 3

      # ==========================================================
      # Prepare Termux glibc build environment
      #
      # IMPORTANT:
      #
      # We do NOT copy Ubuntu /lib/aarch64-linux-gnu.
      #
      # We use the real Termux glibc package source/build system.
      # ==========================================================

      - name: Checkout Termux glibc packages
        shell: bash
        run: |
          set -eux

          rm -rf "$HOME/glibc-packages"

          git clone \
            --depth=1 \
            https://github.com/termux-pacman/glibc-packages.git \
            "$HOME/glibc-packages"

          echo "Termux glibc commit:"
          git -C "$HOME/glibc-packages" rev-parse HEAD

          echo
          echo "Repository:"
          find "$HOME/glibc-packages" \
            -maxdepth 2 \
            -type d \
            | sort \
            | head -100

      # ==========================================================
      # Prepare staging directories
      # ==========================================================

      - name: Prepare glibc staging root
        shell: bash
        run: |
          set -eux

          rm -rf "$GLIBC_ROOTFS"

          mkdir -p \
            "$GLIBC_PREFIX/bin" \
            "$GLIBC_PREFIX/lib" \
            "$GLIBC_PREFIX/include" \
            "$GLIBC_PREFIX/share" \
            "$GLIBC_PREFIX/etc" \
            "$GLIBC_PREFIX/opt"

          echo
          echo "GLIBC_ROOTFS:"
          echo "$GLIBC_ROOTFS"

          echo
          echo "GLIBC_PREFIX:"
          echo "$GLIBC_PREFIX"

          echo
          echo "RUNTIME_PATH:"
          echo "$RUNTIME_PATH"

      # ==========================================================
      # Inspect Termux glibc build infrastructure
      # ==========================================================

      - name: Inspect Termux glibc build system
        shell: bash
        run: |
          set -eux

          cd "$HOME/glibc-packages"

          echo "== cgct =="

          find cgct \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -100

          echo
          echo "== scripts-cgct =="

          find scripts-cgct \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -100

          echo
          echo "== gpkg =="

          find gpkg \
            -maxdepth 2 \
            -name build.sh \
            | sort \
            | head -100

      # ==========================================================
      # IMPORTANT:
      #
      # Do NOT pretend that an empty directory is a glibc rootfs.
      #
      # The actual glibc packages must be populated before Wine
      # configuration.
      # ==========================================================

      - name: Check glibc staging state
        shell: bash
        run: |
          set -eux

          echo "Checking current staging tree..."

          find "$GLIBC_PREFIX" \
            -maxdepth 2 \
            -type d \
            | sort

          echo
          echo "The following loader is required:"
          echo "$GLIBC_PREFIX/lib/ld-linux-aarch64.so.1"

          if [ ! -f "$GLIBC_PREFIX/lib/ld-linux-aarch64.so.1" ]; then
            echo
            echo "======================================================"
            echo "FATAL: Termux glibc rootfs has NOT been populated."
            echo "======================================================"
            echo
            echo "The Wine build must NOT continue."
            echo
            echo "Expected:"
            echo "$GLIBC_PREFIX/lib/ld-linux-aarch64.so.1"
            echo
            echo "The Termux glibc package/bootstrap step must populate:"
            echo "$GLIBC_PREFIX"
            echo
            exit 1
          fi

          file \
            "$GLIBC_PREFIX/lib/ld-linux-aarch64.so.1"

      # ==========================================================
      # Cache LLVM-MinGW
      # ==========================================================

      - name: Cache LLVM MinGW
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ucrt-ubuntu-22.04-aarch64
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ubuntu-22.04-aarch64

      # ==========================================================
      # Install LLVM-MinGW
      # ==========================================================

      - name: Install LLVM MinGW
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -eux

          mkdir -p "$HOME/toolchains"

          cd "$HOME/toolchains"

          ARCHIVE="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-aarch64.tar.xz"

          URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${ARCHIVE}"

          echo "Downloading:"
          echo "$URL"

          wget \
            --tries=5 \
            --retry-connrefused \
            --waitretry=10 \
            "$URL"

          tar -xf "$ARCHIVE"

      # ==========================================================
      # Export LLVM-MinGW
      # ==========================================================

      - name: Export LLVM MinGW
        shell: bash
        run: |
          set -eux

          LLVM_MINGW_PATH="$HOME/toolchains/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-aarch64"

          test -d "$LLVM_MINGW_PATH"
          test -d "$LLVM_MINGW_PATH/bin"

          echo "LLVM_MINGW=$LLVM_MINGW_PATH" >> "$GITHUB_ENV"

          echo "LLVM_MINGW=$LLVM_MINGW_PATH"

      # ==========================================================
      # Verify LLVM-MinGW
      # ==========================================================

      - name: Verify LLVM MinGW
        shell: bash
        run: |
          set -eux

          test -x "$LLVM_MINGW/bin/clang"
          test -x "$LLVM_MINGW/bin/clang++"
          test -x "$LLVM_MINGW/bin/llvm-dlltool"

          echo
          echo "== clang =="

          "$LLVM_MINGW/bin/clang" --version | head -n 3

          echo
          echo "== host architecture =="

          file "$LLVM_MINGW/bin/clang"

          echo
          echo "== Windows targets =="

          ls "$LLVM_MINGW/bin/" |
            grep -E \
              '^(arm64ec|aarch64|i686|x86_64)-w64-mingw32-' |
            head -50 || true

      # ==========================================================
      # Autoconf / Wine tools
      # ==========================================================

      - name: Autogen
        shell: bash
        run: |
          set -eux

          bash build-scripts/build-step0-autogen.sh

      # ==========================================================
      # Cache wine-tools
      # ==========================================================

      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine-tools
          key: wine-tools-arm64-glibc-${{ hashFiles('configure.ac', 'configure', 'Makefile.in', 'build-scripts/build-step0.sh', 'build-scripts/build-step0-autogen.sh') }}

      # ==========================================================
      # Build wine-tools
      # ==========================================================

      - name: Build wine-tools
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -eux

          bash build-scripts/build-step0.sh

      # ==========================================================
      # ccache
      # ==========================================================

      - name: Configure ccache
        shell: bash
        run: |
          set -eux

          mkdir -p "$HOME/.ccache"

          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6

          ccache --zero-stats || true

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-p11-arm64ec-glibc-${{ runner.arch }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-p11-arm64ec-glibc-${{ runner.arch }}-${{ github.ref_name }}-
            ccache-p11-arm64ec-glibc-${{ runner.arch }}-

      # ==========================================================
      # Configure
      # ==========================================================

      - name: Configure ARM64EC Proton
        shell: bash
        env:
          DEPS: ${{ env.GLIBC_PREFIX }}
          GLIBC_PREFIX: ${{ env.GLIBC_PREFIX }}
          GLIBC_ROOTFS: ${{ env.GLIBC_ROOTFS }}
          RUNTIME_PATH: ${{ env.RUNTIME_PATH }}
          LLVM_MINGW: ${{ env.LLVM_MINGW }}
          TARGET: ${{ env.TARGET }}
          WIN_ARCH: ${{ env.WIN_ARCH }}
          TERMUX_PREFIX: ${{ env.TERMUX_PREFIX }}
          TERMUX_TMPDIR: ${{ env.TERMUX_TMPDIR }}
          ENABLE_WAYLAND: ${{ env.ENABLE_WAYLAND }}
          BUILD_ANDROID_SYSVSHM: ${{ env.BUILD_ANDROID_SYSVSHM }}
          BUILD_NTSYNC_ANDROID: ${{ env.BUILD_NTSYNC_ANDROID }}
        run: |
          set -eux

          bash build-scripts/glibc-build-step-arm64ec.sh \
            --configure

      # ==========================================================
      # Build
      # ==========================================================

      - name: Build ARM64EC Proton
        shell: bash
        env:
          DEPS: ${{ env.GLIBC_PREFIX }}
          GLIBC_PREFIX: ${{ env.GLIBC_PREFIX }}
          GLIBC_ROOTFS: ${{ env.GLIBC_ROOTFS }}
          RUNTIME_PATH: ${{ env.RUNTIME_PATH }}
          LLVM_MINGW: ${{ env.LLVM_MINGW }}
          TARGET: ${{ env.TARGET }}
          WIN_ARCH: ${{ env.WIN_ARCH }}
          TERMUX_PREFIX: ${{ env.TERMUX_PREFIX }}
          TERMUX_TMPDIR: ${{ env.TERMUX_TMPDIR }}
          ENABLE_WAYLAND: ${{ env.ENABLE_WAYLAND }}
          BUILD_ANDROID_SYSVSHM: ${{ env.BUILD_ANDROID_SYSVSHM }}
          BUILD_NTSYNC_ANDROID: ${{ env.BUILD_NTSYNC_ANDROID }}
        run: |
          set -eux

          bash build-scripts/glibc-build-step-arm64ec.sh \
            --build

      # ==========================================================
      # ccache statistics
      # ==========================================================

      - name: ccache statistics
        if: always()
        shell: bash
        run: |
          ccache -s || true

      # ==========================================================
      # Install
      # ==========================================================

      - name: Install ARM64EC Proton
        shell: bash
        env:
          DEPS: ${{ env.GLIBC_PREFIX }}
          GLIBC_PREFIX: ${{ env.GLIBC_PREFIX }}
          GLIBC_ROOTFS: ${{ env.GLIBC_ROOTFS }}
          RUNTIME_PATH: ${{ env.RUNTIME_PATH }}
          LLVM_MINGW: ${{ env.LLVM_MINGW }}
          TARGET: ${{ env.TARGET }}
          WIN_ARCH: ${{ env.WIN_ARCH }}
          TERMUX_PREFIX: ${{ env.TERMUX_PREFIX }}
          TERMUX_TMPDIR: ${{ env.TERMUX_TMPDIR }}
          ENABLE_WAYLAND: ${{ env.ENABLE_WAYLAND }}
          BUILD_ANDROID_SYSVSHM: ${{ env.BUILD_ANDROID_SYSVSHM }}
          BUILD_NTSYNC_ANDROID: ${{ env.BUILD_NTSYNC_ANDROID }}
        run: |
          set -eux

          bash build-scripts/glibc-build-step-arm64ec.sh \
            --install

      # ==========================================================
      # Verify output
      # ==========================================================

      - name: Verify output tree
        shell: bash
        run: |
          set -eux

          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          test -d "$OUTPUT_DIR"

          echo "== Output size =="

          du -sh "$OUTPUT_DIR"

          echo
          echo "== Top-level =="

          find "$OUTPUT_DIR" \
            -maxdepth 2 \
            -type d \
            | sort \
            | head -100

      # ==========================================================
      # Verify native Wine
      # ==========================================================

      - name: Verify native glibc Wine
        shell: bash
        run: |
          set -eux

          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          WINE_ELF="$OUTPUT_DIR/lib/wine/aarch64-unix/wine"

          test -f "$WINE_ELF"

          echo "== file =="

          file "$WINE_ELF"

          echo
          echo "== interpreter =="

          llvm-readelf -l "$WINE_ELF" |
            grep 'Requesting program interpreter' || true

          echo
          echo "== RPATH/RUNPATH =="

          llvm-readelf -d "$WINE_ELF" |
            grep -E 'RPATH|RUNPATH' || true

          echo
          echo "== NEEDED =="

          llvm-readelf -d "$WINE_ELF" |
            grep NEEDED || true

          echo
          echo "== Android contamination =="

          if llvm-readelf -l "$WINE_ELF" |
            grep -Eq 'ld-android|/system/bin/linker'; then

            echo "FATAL: Android loader detected"
            exit 1
          fi

          if llvm-readelf -d "$WINE_ELF" |
            grep -Eq 'libandroid|liblog|libnativewindow'; then

            echo "FATAL: Android library detected"
            exit 1
          fi

      # ==========================================================
      # Verify X11
      # ==========================================================

      - name: Verify X11 driver
        shell: bash
        run: |
          set -eux

          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          FOUND=0

          while IFS= read -r -d '' f; do
            echo "X11 driver: $f"
            file "$f"
            FOUND=1
          done < <(
            find "$OUTPUT_DIR/lib/wine" \
              -type f \
              \( \
                -name 'wineX11.drv' \
                -o -name 'winex11.drv' \
              \) \
              -print0
          )

          if [ "$FOUND" != "1" ]; then
            echo "FATAL: Wine X11 driver was not built"
            exit 1
          fi

      # ==========================================================
      # Wayland
      # ==========================================================

      - name: Check optional Wayland
        shell: bash
        run: |
          set -eux

          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          FOUND=0

          while IFS= read -r -d '' f; do
            echo "Wayland: $f"
            file "$f"
            FOUND=1
          done < <(
            find "$OUTPUT_DIR/lib/wine" \
              -type f \
              \( \
                -name 'winewayland.so' \
                -o -name 'winewayland.drv' \
              \) \
              -print0
          )

          if [ "$FOUND" = "0" ]; then
            echo "Wayland not present."
            echo "This is allowed."
            echo "Termux-X11 remains primary."
          fi

      # ==========================================================
      # Runtime metadata
      # ==========================================================

      - name: Generate runtime metadata
        shell: bash
        run: |
          set -eux

          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          cat > "$OUTPUT_DIR/termux-glibc-runtime.txt" <<EOF
          Proton 11.0-1 ARM64EC

          Architecture:
          aarch64

          Native target:
          aarch64-linux-gnu

          Windows targets:
          arm64ec,aarch64,i386

          Runtime:
          Real Termux glibc

          Runtime prefix:
          /data/data/com.termux/files/usr/glibc

          Display:
          Termux-X11

          DISPLAY:
          :0

          GDK_BACKEND:
          x11

          XDG_SESSION_TYPE:
          x11

          Wayland:
          ${ENABLE_WAYLAND}

          Android NDK:
          disabled

          android_sysvshm:
          disabled

          ntsync-android:
          disabled
          EOF

          cat "$OUTPUT_DIR/termux-glibc-runtime.txt"

      # ==========================================================
      # PrefixPack
      #
      # DO NOT silently create a fake prefixPack.
      # ==========================================================

      - name: Check prefixPack
        shell: bash
        run: |
          set -eux

          PREFIX_PACK="$GITHUB_WORKSPACE/prefixPack.txz"

          if [ ! -f "$PREFIX_PACK" ]; then
            echo
            echo "======================================================"
            echo "FATAL: prefixPack.txz is missing"
            echo "======================================================"
            echo
            echo "This workflow cannot package a WCP without it."
            echo
            exit 1
          fi

          file "$PREFIX_PACK"
          ls -lh "$PREFIX_PACK"

      # ==========================================================
      # profile.json
      # ==========================================================

      - name: Generate profile.json
        shell: bash
        run: |
          set -eux

          cat > "$GITHUB_WORKSPACE/profile.json" <<'EOF'
          {
            "type": "Proton",
            "versionName": "11.0-1-arm64ec-termux-glibc-x11",
            "versionCode": 10,
            "description": "Proton 11.0-1 ARM64EC for real Termux glibc with Termux-X11.",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

          python3 -m json.tool \
            "$GITHUB_WORKSPACE/profile.json"

      # ==========================================================
      # Package WCP
      # ==========================================================

      - name: Package Proton WCP
        shell: bash
        run: |
          set -eux

          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          test -d "$OUTPUT_DIR/bin"
          test -d "$OUTPUT_DIR/lib"
          test -d "$OUTPUT_DIR/share"

          cp \
            "$GITHUB_WORKSPACE/prefixPack.txz" \
            "$OUTPUT_DIR/"

          cp \
            "$GITHUB_WORKSPACE/profile.json" \
            "$OUTPUT_DIR/"

          cd "$OUTPUT_DIR"

          tar \
            -I 'zstd -T0 -19' \
            -cf \
            "$GITHUB_WORKSPACE/proton-11.0-1-arm64ec-termux-glibc-x11.wcp" \
            bin \
            lib \
            share \
            prefixPack.txz \
            profile.json \
            termux-glibc-runtime.txt

      # ==========================================================
      # Verify WCP
      # ==========================================================

      - name: Verify WCP
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          WCP="proton-11.0-1-arm64ec-termux-glibc-x11.wcp"

          test -f "$WCP"

          tar \
            -I zstd \
            -tf "$WCP" \
            > wcp.lst

          echo "== WCP =="

          head -100 wcp.lst

          grep -qx 'profile.json' wcp.lst
          grep -qx 'prefixPack.txz' wcp.lst
          grep -qx 'termux-glibc-runtime.txt' wcp.lst

          tar \
            -I zstd \
            -xf "$WCP" \
            -O profile.json \
            > wcp-profile.json

          cmp \
            wcp-profile.json \
            profile.json

      # ==========================================================
      # Upload
      # ==========================================================

      - name: Upload Proton ARM64EC WCP
        uses: actions/upload-artifact@v4
        with:
          name: proton-11.0-1-arm64ec-termux-glibc-x11
          path: proton-11.0-1-arm64ec-termux-glibc-x11.wcp
          retention-days: 30

      - name: Upload installed Proton tree
        uses: actions/upload-artifact@v4
        with:
          name: proton-11.0-1-arm64ec-termux-glibc-x11-tree
          path: ~/compiled-files-aarch64
          retention-days: 7
