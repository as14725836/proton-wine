name: Proton 11.0-1 ARM64EC — Termux glibc + termux-x11

run-name: "Proton 11.0-1 ARM64EC / Termux glibc / X11 — ${{ github.ref_name }}"

on:
  push:
    branches:
      - main
      - master
      - proton_11.0
      - 'staging/proton_11.0/**'

  pull_request:
    branches:
      - main
      - master
      - proton_11.0

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64

    env:
      # ==========================================================
      # Architecture
      # ==========================================================

      ARCH: aarch64
      TARGET: aarch64-linux-gnu

      # Windows PE targets.
      #
      # IMPORTANT:
      # This does NOT mean Ubuntu needs i386 packages.
      #
      WIN_ARCH: arm64ec,aarch64,i386

      # ==========================================================
      # Real Termux glibc
      # ==========================================================

      TERMUX_PREFIX: /data/data/com.termux/files/usr
      GLIBC_PREFIX: /data/data/com.termux/files/usr/glibc

      # CI staging root.
      #
      # Expected:
      #
      # termuxfs/
      #   aarch64-glibc/
      #     data/data/com.termux/files/usr/glibc/
      #
      GLIBC_ROOTFS: ${{ github.workspace }}/termuxfs/aarch64-glibc

      # Runtime tmp used by the Termux-side build.
      TERMUX_TMPDIR: /data/data/com.termux/files/usr/tmp

      # ==========================================================
      # LLVM-MinGW
      # ==========================================================

      LLVM_MINGW_VERSION: 20250920

      # ==========================================================
      # Display
      # ==========================================================

      DISPLAY: :0
      GDK_BACKEND: x11
      XDG_SESSION_TYPE: x11

      # ==========================================================
      # Wine
      # ==========================================================

      ENABLE_WAYLAND: auto

      # Android-specific helpers are deliberately disabled.
      BUILD_ANDROID_SYSVSHM: "0"
      BUILD_NTSYNC_ANDROID: "0"

      # ==========================================================
      # ccache
      # ==========================================================

      CCACHE_MAXSIZE: 5G

    steps:

      # ==========================================================
      # Free disk space
      # ==========================================================

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

          df -h

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ==========================================================
      # Host dependencies
      #
      # IMPORTANT:
      #
      # ubuntu-24.04-arm = ARM64 Ubuntu.
      #
      # DO NOT:
      #
      #   dpkg --add-architecture i386
      #   gcc-multilib
      #   g++-multilib
      #   libc6-dev-i386
      #   xxx:i386
      #
      # i386 here is a Windows target supplied by LLVM-MinGW.
      # ==========================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            xz-utils \
            zstd \
            flex \
            bison \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            ccache \
            llvm \
            clang \
            file \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            libwayland-bin \
            libfreetype6-dev \
            libpng-dev \
            zlib1g-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxfixes-dev

      # ==========================================================
      # Verify host
      # ==========================================================

      - name: Verify ARM64 glibc host
        shell: bash
        run: |
          set -eux

          echo "== uname =="
          uname -a

          echo
          echo "== machine =="
          uname -m

          test "$(uname -m)" = "aarch64"

          echo
          echo "== native compiler =="
          cc --version | head -n 2

          echo
          echo "== native C++ compiler =="
          c++ --version | head -n 2

          echo
          echo "== libc =="
          ldd --version | head -n 2

          echo
          echo "== clang =="
          clang --version | head -n 3

      # ==========================================================
      # Prepare Termux glibc rootfs
      #
      # This workflow intentionally does NOT download the old
      # GameNative bionic termuxfs.
      #
      # The repository/build environment must provide:
      #
      # $GLIBC_ROOTFS/data/data/com.termux/files/usr/glibc
      #
      # If this directory is generated by another step in your
      # repository, that step must run BEFORE this verification.
      # ==========================================================

      - name: Verify Termux glibc rootfs
        shell: bash
        run: |
          set -eux

          DEPS="$GLIBC_ROOTFS/data/data/com.termux/files/usr/glibc"

          echo "GLIBC_ROOTFS=$GLIBC_ROOTFS"
          echo "DEPS=$DEPS"

          test -d "$DEPS"

          test -d "$DEPS/lib"
          test -d "$DEPS/include"
          test -d "$DEPS/share"

          echo "DEPS=$DEPS" >> "$GITHUB_ENV"

          echo
          echo "== glibc prefix =="
          ls -ld "$DEPS"
          ls -ld "$DEPS/lib"
          ls -ld "$DEPS/include"
          ls -ld "$DEPS/share"

      # ==========================================================
      # Cache LLVM-MinGW
      #
      # ARM64 runner should use ARM64-hosted LLVM-MinGW.
      # ==========================================================

      - name: Cache LLVM MinGW
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ucrt-ubuntu-22.04-aarch64
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ubuntu-22.04-aarch64

      - name: Install LLVM MinGW
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -eux

          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"

          ARCHIVE="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-aarch64.tar.xz"

          wget \
            --tries=5 \
            --retry-connrefused \
            --waitretry=10 \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${ARCHIVE}"

          tar -xf "$ARCHIVE"

      - name: Export LLVM MinGW
        shell: bash
        run: |
          set -eux

          LLVM_MINGW_PATH="$HOME/toolchains/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-aarch64"

          test -d "$LLVM_MINGW_PATH"
          test -d "$LLVM_MINGW_PATH/bin"

          echo "LLVM_MINGW=$LLVM_MINGW_PATH" >> "$GITHUB_ENV"

          echo "LLVM_MINGW=$LLVM_MINGW_PATH"

      # ==========================================================
      # Verify LLVM-MinGW
      # ==========================================================

      - name: Verify LLVM MinGW
        shell: bash
        run: |
          set -eux

          test -x "$LLVM_MINGW/bin/clang"
          test -x "$LLVM_MINGW/bin/clang++"
          test -x "$LLVM_MINGW/bin/llvm-dlltool"

          echo
          echo "== clang =="
          "$LLVM_MINGW/bin/clang" --version | head -n 3

          echo
          echo "== available Windows targets =="
          ls "$LLVM_MINGW/bin/" \
            | grep -E \
              '^(arm64ec|aarch64|i686|x86_64)-w64-mingw32-' \
            | head -50 || true

      # ==========================================================
      # Autoconf / Wine tools
      # ==========================================================

      - name: Autogen
        shell: bash
        run: |
          set -eux

          bash build-scripts/build-step0-autogen.sh

      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine-tools
          key: wine-tools-arm64-glibc-${{ hashFiles(
            'configure.ac',
            'configure',
            'Makefile.in',
            'build-scripts/build-step0.sh',
            'build-scripts/build-step0-autogen.sh'
          ) }}

      - name: Build wine-tools
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -eux

          bash build-scripts/build-step0.sh

      # ==========================================================
      # ccache
      # ==========================================================

      - name: Configure ccache
        shell: bash
        run: |
          set -eux

          mkdir -p "$HOME/.ccache"

          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6

          ccache --zero-stats || true

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-p11-arm64ec-glibc-${{ runner.arch }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-p11-arm64ec-glibc-${{ runner.arch }}-${{ github.ref_name }}-
            ccache-p11-arm64ec-glibc-${{ runner.arch }}-

      # ==========================================================
      # Configure
      # ==========================================================

      - name: Configure ARM64EC Proton
        shell: bash
        env:
          DEPS: ${{ env.DEPS }}
          GLIBC_PREFIX: ${{ env.GLIBC_PREFIX }}
          LLVM_MINGW: ${{ env.LLVM_MINGW }}
          TARGET: ${{ env.TARGET }}
          WIN_ARCH: ${{ env.WIN_ARCH }}
          TERMUX_TMPDIR: ${{ env.TERMUX_TMPDIR }}
          ENABLE_WAYLAND: ${{ env.ENABLE_WAYLAND }}
          BUILD_ANDROID_SYSVSHM: ${{ env.BUILD_ANDROID_SYSVSHM }}
          BUILD_NTSYNC_ANDROID: ${{ env.BUILD_NTSYNC_ANDROID }}
        run: |
          set -eux

          bash build-scripts/glibc-build-step-arm64ec.sh \
            --configure

      # ==========================================================
      # Build
      # ==========================================================

      - name: Build ARM64EC Proton
        shell: bash
        env:
          DEPS: ${{ env.DEPS }}
          GLIBC_PREFIX: ${{ env.GLIBC_PREFIX }}
          LLVM_MINGW: ${{ env.LLVM_MINGW }}
          TARGET: ${{ env.TARGET }}
          WIN_ARCH: ${{ env.WIN_ARCH }}
          TERMUX_TMPDIR: ${{ env.TERMUX_TMPDIR }}
          ENABLE_WAYLAND: ${{ env.ENABLE_WAYLAND }}
          BUILD_ANDROID_SYSVSHM: ${{ env.BUILD_ANDROID_SYSVSHM }}
          BUILD_NTSYNC_ANDROID: ${{ env.BUILD_NTSYNC_ANDROID }}
        run: |
          set -eux

          bash build-scripts/glibc-build-step-arm64ec.sh \
            --build

      # ==========================================================
      # ccache statistics
      # ==========================================================

      - name: ccache statistics
        if: always()
        run: |
          ccache -s || true

      # ==========================================================
      # Install
      # ==========================================================

      - name: Install ARM64EC Proton
        shell: bash
        env:
          DEPS: ${{ env.DEPS }}
          GLIBC_PREFIX: ${{ env.GLIBC_PREFIX }}
          LLVM_MINGW: ${{ env.LLVM_MINGW }}
          TARGET: ${{ env.TARGET }}
          WIN_ARCH: ${{ env.WIN_ARCH }}
          TERMUX_TMPDIR: ${{ env.TERMUX_TMPDIR }}
          ENABLE_WAYLAND: ${{ env.ENABLE_WAYLAND }}
          BUILD_ANDROID_SYSVSHM: ${{ env.BUILD_ANDROID_SYSVSHM }}
          BUILD_NTSYNC_ANDROID: ${{ env.BUILD_NTSYNC_ANDROID }}
        run: |
          set -eux

          bash build-scripts/glibc-build-step-arm64ec.sh \
            --install

      # ==========================================================
      # Verify output
      # ==========================================================

      - name: Verify output tree
        shell: bash
        run: |
          set -eux

          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          test -d "$OUTPUT_DIR"

          echo "== Output size =="
          du -sh "$OUTPUT_DIR"

          echo
          echo "== Top-level =="
          find "$OUTPUT_DIR" \
            -maxdepth 2 \
            -type d \
            | sort \
            | head -100

          echo
          echo "== Wine files =="
          find "$OUTPUT_DIR/lib/wine" \
            -maxdepth 2 \
            -type f \
            \( \
              -name 'ntdll.so' \
              -o -name 'win32u.so' \
              -o -name 'wineX11.drv' \
              -o -name 'winewayland.so' \
              -o -name 'winewayland.drv' \
            \) \
            -print || true

      # ==========================================================
      # Verify native glibc Wine
      # ==========================================================

      - name: Verify native glibc Wine
        shell: bash
        run: |
          set -eux

          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          WINE_ELF="$OUTPUT_DIR/lib/wine/aarch64-unix/wine"

          test -f "$WINE_ELF"

          echo "== file =="
          file "$WINE_ELF"

          echo
          echo "== ELF header =="
          llvm-readelf -h "$WINE_ELF"

          echo
          echo "== interpreter =="
          llvm-readelf -l "$WINE_ELF" |
            grep 'Requesting program interpreter' || true

          echo
          echo "== NEEDED =="
          llvm-readelf -d "$WINE_ELF" |
            grep NEEDED || true

          echo
          echo "== Android loader check =="

          if llvm-readelf -l "$WINE_ELF" |
              grep -Eq 'ld-android|/system/bin/linker'; then
            echo "FATAL: Android loader detected"
            exit 1
          fi

          echo
          echo "== Android library check =="

          if llvm-readelf -d "$WINE_ELF" |
              grep -Eq 'libandroid|liblog|libnativewindow'; then
            echo "FATAL: Android native dependency detected"
            exit 1
          fi

      # ==========================================================
      # Verify X11
      # ==========================================================

      - name: Verify X11 driver
        shell: bash
        run: |
          set -eux

          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          echo "== X11 drivers =="

          find "$OUTPUT_DIR/lib/wine" \
            -type f \
            \( \
              -name 'wineX11.drv' \
              -o -name 'winex11.drv' \
            \) \
            -print

          FOUND=0

          while IFS= read -r -d '' f; do
            echo "OK: $f"
            file "$f"
            FOUND=1
          done < <(
            find "$OUTPUT_DIR/lib/wine" \
              -type f \
              \( \
                -name 'wineX11.drv' \
                -o -name 'winex11.drv' \
              \) \
              -print0
          )

          if [ "$FOUND" != "1" ]; then
            echo "FATAL: Wine X11 driver was not built"
            exit 1
          fi

      # ==========================================================
      # Optional Wayland
      # ==========================================================

      - name: Check optional Wayland
        shell: bash
        run: |
          set -eux

          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          FOUND=0

          while IFS= read -r -d '' f; do
            echo "Wayland available: $f"
            file "$f"
            FOUND=1
          done < <(
            find "$OUTPUT_DIR/lib/wine" \
              -type f \
              \( \
                -name 'winewayland.so' \
                -o -name 'winewayland.drv' \
              \) \
              -print0
          )

          if [ "$FOUND" = "0" ]; then
            echo "Wayland driver not present."
            echo "This is allowed."
            echo "Termux-X11 remains the primary backend."
          fi

      # ==========================================================
      # Verify native ELF dependencies
      # ==========================================================

      - name: Verify native ELF dependencies
        shell: bash
        run: |
          set -eux

          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          find "$OUTPUT_DIR/lib/wine/aarch64-unix" \
            -type f \
            -print0 |
          while IFS= read -r -d '' f; do

            if file "$f" | grep -q 'ELF'; then

              echo
              echo "========================================"
              echo "$f"
              echo "========================================"

              llvm-readelf -d "$f" 2>/dev/null |
                grep NEEDED || true

              if llvm-readelf -d "$f" 2>/dev/null |
                  grep -Eq 'libandroid|liblog|libnativewindow|ld-android'; then

                echo
                echo "FATAL: Android dependency found:"
                echo "$f"

                exit 1
              fi
            fi
          done

      # ==========================================================
      # Runtime metadata
      # ==========================================================

      - name: Generate runtime metadata
        shell: bash
        run: |
          set -eux

          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          cat > "$OUTPUT_DIR/termux-glibc-runtime.txt" <<'EOF'
          Proton 11.0-1 ARM64EC

          Target:
          Real Termux glibc

          Architecture:
          aarch64

          Native target:
          aarch64-linux-gnu

          Runtime prefix:
          /data/data/com.termux/files/usr/glibc

          Display:
          Termux-X11

          DISPLAY:
          :0

          GDK_BACKEND:
          x11

          XDG_SESSION_TYPE:
          x11

          Windows targets:
          arm64ec
          aarch64
          i386

          Android NDK:
          NOT USED

          android_sysvshm:
          NOT USED

          ntsync-android:
          NOT USED

          Wayland:
          OPTIONAL
          EOF

          cat "$OUTPUT_DIR/termux-glibc-runtime.txt"

      # ==========================================================
      # PrefixPack
      #
      # IMPORTANT:
      #
      # There is intentionally NO automatic download of the old
      # GameNative bionic prefixPack here.
      #
      # A glibc-compatible prefixPack must be supplied by the
      # repository/build process.
      # ==========================================================

      - name: Verify glibc prefixPack
        shell: bash
        run: |
          set -eux

          PREFIX_PACK="$GITHUB_WORKSPACE/prefixPack.txz"

          test -f "$PREFIX_PACK"

          echo "== prefixPack =="
          ls -lh "$PREFIX_PACK"

          echo
          file "$PREFIX_PACK"

      # ==========================================================
      # Profile
      # ==========================================================

      - name: Generate profile.json
        shell: bash
        run: |
          set -eux

          cat > "$GITHUB_WORKSPACE/profile.json" <<'EOF'
          {
            "type": "Proton",
            "versionName": "11.0-1-arm64ec-termux-glibc-x11",
            "versionCode": 10,
            "description": "Proton 11.0-1 ARM64EC built for real Termux glibc. Native Unix side targets aarch64-linux-gnu. Termux-X11 is the primary display backend. Wayland is optional. Android NDK, android_sysvshm and ntsync-android are not used.",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

          python3 -m json.tool \
            "$GITHUB_WORKSPACE/profile.json"

      # ==========================================================
      # Package WCP
      # ==========================================================

      - name: Package Proton WCP
        shell: bash
        run: |
          set -eux

          OUTPUT_DIR="$HOME/compiled-files-aarch64"

          test -d "$OUTPUT_DIR/bin"
          test -d "$OUTPUT_DIR/lib"
          test -d "$OUTPUT_DIR/share"

          test -f "$GITHUB_WORKSPACE/prefixPack.txz"
          test -f "$GITHUB_WORKSPACE/profile.json"

          cd "$OUTPUT_DIR"

          cp "$GITHUB_WORKSPACE/prefixPack.txz" .
          cp "$GITHUB_WORKSPACE/profile.json" .

          tar \
            -I 'zstd -T0 -19' \
            -cf \
            "$GITHUB_WORKSPACE/proton-11.0-1-arm64ec-termux-glibc-x11.wcp" \
            bin \
            lib \
            share \
            prefixPack.txz \
            profile.json \
            termux-glibc-runtime.txt

      # ==========================================================
      # Verify WCP
      # ==========================================================

      - name: Verify WCP
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          WCP="proton-11.0-1-arm64ec-termux-glibc-x11.wcp"

          test -f "$WCP"

          tar \
            -I zstd \
            -tf "$WCP" \
            > wcp.lst

          echo "== WCP contents =="
          head -100 wcp.lst

          for e in \
            profile.json \
            prefixPack.txz \
            termux-glibc-runtime.txt
          do
            grep -qx -- "$e" wcp.lst || {
              echo "FATAL: $e missing from WCP"
              exit 1
            }
          done

          tar \
            -I zstd \
            -xf "$WCP" \
            -O profile.json \
            > wcp-profile.json

          cmp \
            wcp-profile.json \
            profile.json

          python3 -c '
          import json

          with open("wcp-profile.json") as f:
              p = json.load(f)

          print("type:", p["type"])
          print("versionName:", p["versionName"])
          print("versionCode:", p["versionCode"])
          print("prefixPack:", p["wine"]["prefixPack"])
          '

          echo
          echo "WCP size:"
          stat -c '%s bytes' "$WCP"

      # ==========================================================
      # Verify lsteamclient
      # ==========================================================

      - name: Verify lsteamclient
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE"

          tar \
            -I zstd \
            -tf proton-11.0-1-arm64ec-termux-glibc-x11.wcp \
            > wcp.lst

          FOUND=0

          for e in \
            lib/wine/aarch64-windows/lsteamclient.dll \
            lib/wine/i386-windows/lsteamclient.dll \
            lib/wine/aarch64-unix/lsteamclient.so
          do
            if grep -qx -- "$e" wcp.lst; then
              echo "OK: $e"
              FOUND=1
            else
              echo "Not present: $e"
            fi
          done

          if [ "$FOUND" = "0" ]; then
            echo "FATAL: no lsteamclient was found"
            exit 1
          fi

      # ==========================================================
      # Upload WCP
      # ==========================================================

      - name: Upload Proton ARM64EC WCP
        uses: actions/upload-artifact@v4
        with:
          name: proton-11.0-1-arm64ec-termux-glibc-x11
          path: proton-11.0-1-arm64ec-termux-glibc-x11.wcp
          retention-days: 30

      # ==========================================================
      # Upload installed tree
      # ==========================================================

      - name: Upload installed Proton tree
        uses: actions/upload-artifact@v4
        with:
          name: proton-11.0-1-arm64ec-termux-glibc-x11-tree
          path: ~/compiled-files-aarch64
          retention-days: 7
